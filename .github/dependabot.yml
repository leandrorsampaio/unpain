version: 2
# Keep the pinned versions current without giving up pinning: Dependabot opens
# grouped PRs (which CI must pass) instead of letting anything float. Reviewing a
# weekly PR beats an un-audited transitive bump landing silently.
updates:
  # GitHub Actions — bumps the commit SHA and the trailing version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Python — driven by requirements.in. requirements.txt is compiled with
  # `uv pip compile --universal` (see requirements.in) so it installs on Windows too.
  # If an update drops the platform markers (uvloop must stay `sys_platform != 'win32'`),
  # the Desktop workflow's Windows build fails on that branch: regenerate with uv.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  # npm dev dependency (Playwright) — locked via package-lock.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
